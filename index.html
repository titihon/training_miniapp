<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101114"><title>Мой тренировочный план</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:var(--tg-theme-bg-color,#101114);--card:var(--tg-theme-secondary-bg-color,#1b1d22);--text:var(--tg-theme-text-color,#f4f5f7);--muted:var(--tg-theme-hint-color,#969ba5);--accent:var(--tg-theme-button-color,#b6f36b);--accentText:var(--tg-theme-button-text-color,#101114);--line:#ffffff14}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin-inline:auto}.top{padding:18px 0 12px}.eyebrow{font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}.top h1{font-size:28px;line-height:1.1;margin:5px 0}.subtitle{color:var(--muted);margin:6px 0 0}.weekbox,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.weekrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.weekrow label{color:var(--muted);font-size:12px;display:block}.weekrow select{font:inherit;color:var(--text);background:#ffffff12;border:1px solid var(--line);border-radius:10px;padding:9px 12px}.progress{height:6px;background:#ffffff18;border-radius:9px;margin-top:13px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);border-radius:9px;transition:.2s}.days{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.day{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 5px;text-align:center;color:var(--muted);font-size:12px;cursor:pointer}.day b{display:block;color:var(--text);font-size:13px;margin-top:3px}.day.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.day.done:after{content:' ✓';color:var(--accent)}h2{font-size:19px;margin:20px 0 5px}.note{color:var(--muted);font-size:13px;margin:0 0 12px}.exercise{padding:14px 0;border-top:1px solid var(--line)}.ex-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.ex-head strong{font-size:15px}.sets{color:var(--accent);font-weight:650;white-space:nowrap}.desc{font-size:13px;color:var(--muted);margin-top:3px}.check{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px;margin-top:10px}.check input{accent-color:var(--accent);width:18px;height:18px}.weight{border:1px solid var(--line);border-radius:13px;padding:12px;margin-top:12px}.weighthead{font-weight:650}.weightgrid{display:flex;gap:8px;margin-top:8px}.weightgrid span{flex:1;background:#ffffff0b;border-radius:9px;padding:8px;font-size:12px;color:var(--muted)}.weightgrid b{display:block;color:var(--text);font-size:14px}.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:9px 13px;white-space:nowrap;font:inherit}.tab.active{background:var(--accent);border-color:var(--accent);color:var(--accentText);font-weight:650}.footer{font-size:12px;color:var(--muted);margin:18px 2px}.smallbtn{border:0;background:transparent;color:var(--muted);font:inherit;text-decoration:underline;padding:8px 0;cursor:pointer}
</style></head><body>
<header class="top"><div class="eyebrow">ТРЕНИРОВОЧНЫЙ ДНЕВНИК · 12 НЕДЕЛЬ</div><h1>Набор массы</h1><p class="subtitle">66 → 73 кг · Верх / Низ · 4 раза в неделю</p></header>
<section class="weekbox"><div class="weekrow"><div><label>ТЕКУЩАЯ НЕДЕЛЯ</label><strong id="weekLabel">Неделя 1 из 12</strong></div><select id="weekSelect" aria-label="Выбрать неделю"></select></div><div class="progress"><i id="progress"></i></div><div class="note" id="progressText" style="margin:8px 0 0"></div></section>
<div class="days" id="days"></div><main id="content"></main><p class="footer">Отмеченные упражнения сохраняются в памяти этого устройства. Рабочие подходы выполняй с запасом 1–3 повтора; если техника распадается или вес слишком тяжёлый — повтори неделю.</p><button class="smallbtn" id="reset">Сбросить отметки этой недели</button>
<script>
const days=[
 {id:'mon',name:'Понедельник',short:'Пн',title:'Верх А',items:[['Жим лёжа','4×5–8','Основное упражнение','benchA'],['Подтягивания / верхний блок','4×6–10'],['Жим гантелей на наклонной','3×8–12'],['Тяга горизонтального блока','3×8–12'],['Разведения гантелей в стороны','3×12–15'],['Сгибание рук со штангой','3×8–12'],['Разгибание рук на блоке','3×10–15']]},
 {id:'tue',name:'Вторник',short:'Вт',title:'Низ А',items:[['Присед со штангой','4×5–8','Основное упражнение','squatA'],['Румынская тяга','3×6–10'],['Жим ногами','3×8–12'],['Сгибание ног лёжа','3×10–15'],['Подъёмы на носки','4×10–15'],['Пресс','3×10–20']]},
 {id:'thu',name:'Четверг',short:'Чт',title:'Верх Б',items:[['Жим лёжа','3×8–10','Объёмный день','benchB'],['Тяга верхнего блока / подтягивания','3×8–12'],['Жим гантелей сидя','3×8–12'],['Тяга гантели / горизонтального блока','3×8–12'],['Разведения в стороны','4×12–20'],['Разведения на заднюю дельту','3×12–20'],['Молотковые сгибания','3×10–15'],['Французский жим / разгибание из-за головы','3×10–15']]},
 {id:'sat',name:'Суббота',short:'Сб',title:'Низ Б',items:[['Присед со штангой','3×6–9','Объёмный день','squatB'],['Болгарские приседания','3×8–12 на ногу'],['Румынская тяга','3×8–10'],['Разгибание ног','3×10–15'],['Сгибание ног','3×10–15'],['Подъёмы на носки','4×10–15'],['Пресс','3×10–20']]}
];
const benchA=[[65,4,6],[67.5,4,6],[67.5,4,7],[70,4,6],[70,4,7],[72.5,4,6],[72.5,4,7],[75,4,5],[75,4,6],[77.5,4,5],[77.5,4,4],[60,3,5]],benchB=[[60,3,10],[62.5,3,10],[65,3,9],[65,3,10],[67.5,3,9],[67.5,3,10],[70,3,9],[70,3,8],[72.5,3,8],[72.5,3,8],[75,3,7],[55,2,8]],squatA=[[70,4,6],[72.5,4,6],[72.5,4,7],[75,4,6],[75,4,7],[77.5,4,6],[77.5,4,7],[80,4,6],[82.5,4,5],[85,4,5],[87.5,4,4],[65,3,5]],squatB=[[60,3,8],[60,3,9],[62.5,3,8],[62.5,3,9],[65,3,8],[65,3,9],[67.5,3,8],[67.5,3,8],[70,3,8],[70,3,8],[72.5,3,6],[55,2,8]];
const plans={benchA,benchB,squatA,squatB};let week=1,active='mon';const key='training-miniapp-v1';let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
const $=s=>document.querySelector(s);const fmt=n=>Number.isInteger(n)?n:String(n).replace('.',',');
for(let i=1;i<=12;i++)$('#weekSelect').add(new Option('Неделя '+i,i));$('#weekSelect').onchange=()=>{week=+$('#weekSelect').value;render()};
function markKey(day,index){return `${week}-${day}-${index}`}
function render(){ $('#weekSelect').value=week;$('#weekLabel').textContent=`Неделя ${week} из 12`;const selected=days.find(d=>d.id===active);$('#days').innerHTML=days.map(d=>`<button class="day ${d.id===active?'active':''} ${d.items.every((_,i)=>state[markKey(d.id,i)])?'done':''}" data-day="${d.id}">${d.short}<b>${d.title}</b></button>`).join('');document.querySelectorAll('.day').forEach(b=>b.onclick=()=>{active=b.dataset.day;render()});let done=selected.items.filter((_,i)=>state[markKey(selected.id,i)]).length;$('#progress').style.width=`${Math.round(done/selected.items.length*100)}%`;$('#progressText').textContent=`${done} из ${selected.items.length} упражнений отмечено · отметки сохраняются`;
$('#content').innerHTML=`<h2>${selected.name} — ${selected.title}</h2><p class="note">${selected.id==='mon'?'Силовой акцент на верх тела.':selected.id==='tue'?'Силовой акцент на ноги.':selected.id==='thu'?'Объёмная тренировка верха.':'Объёмная тренировка низа.'} Выбери вес для базового упражнения ниже.</p>${selected.items.map((x,i)=>{let p=x[3]?plans[x[3]][week-1]:null;return `<article class="exercise"><div class="ex-head"><div><strong>${x[0]}</strong><div class="desc">${x[2]||'Рабочий диапазон повторений'}</div></div><span class="sets">${p?`${fmt(p[0])} кг · ${p[1]}×${p[2]}`:x[1]}</span></div>${p?`<div class="weight"><div class="weighthead">План на неделю ${week}</div><div class="weightgrid"><span>Вес<b>${fmt(p[0])} кг</b></span><span>Подходы<b>${p[1]}</b></span><span>Повторы<b>${p[2]}</b></span></div></div>`:''}<label class="check"><input type="checkbox" data-index="${i}" ${state[markKey(selected.id,i)]?'checked':''}> Выполнено</label></article>`}).join('')}`;document.querySelectorAll('[data-index]').forEach(c=>c.onchange=()=>{state[markKey(selected.id,c.dataset.index)]=c.checked;localStorage.setItem(key,JSON.stringify(state));render()})}
$('#reset').onclick=()=>{days.find(d=>d.id===active).items.forEach((_,i)=>delete state[markKey(active,i)]);localStorage.setItem(key,JSON.stringify(state));render()};render();
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();document.documentElement.style.setProperty('--bg','var(--tg-theme-bg-color,#101114)')}
</script></body></html>
